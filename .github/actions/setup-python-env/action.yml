name: Set up the Python toolchain
description: >-
  Install Python and uv, then sync the project from its committed uv.lock. The
  repository must already be checked out — a local composite action is loaded from
  the workspace — so callers keep their own actions/checkout step, whose arguments
  (ref, fetch-depth) differ per job.

inputs:
  python-version:
    description: >-
      Python version to install. The default is a floor, not this project's version —
      this file is vendored byte-identical from devkit, so it cannot know one. A
      generated project's gate passes its own `python_version` explicitly at every
      call site for exactly that reason; a project that moves off 3.12 and relies on
      the default here would provision the wrong interpreter without failing.
    required: false
    default: "3.12"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install uv
      shell: bash
      run: pip install uv
    - name: Sync the project from uv.lock
      # The same command `.claude/hooks/session-start.sh` runs, against the same
      # committed lock — so a job provisions the way a session does, and a lock that
      # cannot resolve fails here rather than in someone's sandbox.
      #
      # Both flags, always. They are each a no-op in one of the two shapes this
      # action serves: devkit declares a PEP 735 `dev` dependency-group and no
      # extras, a generated project declares a `dev` extra and no groups. Passing
      # both is what lets one action cover them without an input nobody would
      # remember to set. mypy comes along either way, which matters — devkit's own
      # `lint-all.py` skips linters it cannot import, so omitting it would silently
      # drop type-checking rather than fail.
      shell: bash
      run: uv sync --all-extras --all-groups
