version: 2

# `github-actions` is the entry the vendored contract test asserts specifically:
# every workflow here pins actions by major (`actions/checkout@v7`), and nothing else
# in the repository moves those pins. `uv` covers the Python side, which is where this
# project's own dependency surface lives.
#
# Updates land grouped and are merged by `.github/workflows/dependabot-automerge.yml`
# once `PR Gate` passes.
#
# `assignees` is per-entry, and it is what puts a bot PR on the "Assigned" tab of
# github.com/pulls: nothing else about a Dependabot PR is keyed to a person, so an
# unassigned entry opens PRs reachable only by opening this repository.

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    assignees:
      - alexandrec90
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    assignees:
      - alexandrec90
    # Bump uv.lock, never the pyproject floors. Unset, Dependabot raised this library's
    # `pandas>=2.2` to `pandas>=3.0.6` in PR #40, and ibkr_trader, which needs pandas<3,
    # could no longer resolve against it.
    versioning-strategy: increase-if-necessary
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
