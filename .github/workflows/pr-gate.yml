name: PR Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pre-commit:
    name: Pre-commit gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install project toolchain
        run: |
          python -m pip install uv
          uv sync --all-extras --all-groups
      - name: Run every hook over the repository
        run: uv run pre-commit run --all-files --show-diff-on-failure

  project-checks:
    name: Lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install project toolchain
        run: |
          python -m pip install uv
          uv sync --all-extras --all-groups
      - name: Lint and type-check
        run: uv run python scripts/lint-all.py
      - name: Application suite
        run: uv run python scripts/run-tests.py
      - name: Harness hook tests
        run: uv run python -m pytest scripts/hooks/tests/ -q

  devkit-drift:
    name: Vendored harness drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check out released DevKit
        uses: actions/checkout@v7
        with:
          repository: alexandrec90/devkit
          ref: v0.11.4
          path: .devkit-src
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Drift check
        env:
          DEVKIT_DIR: ${{ github.workspace }}/.devkit-src
        run: python scripts/sync-devkit.py --check
