name: PR Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pre-commit:
    name: Pre-commit gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install project toolchain
        run: |
          python -m pip install uv
          uv sync --all-extras --all-groups
      - name: Run every hook over the repository
        run: uv run pre-commit run --all-files --show-diff-on-failure

  project-checks:
    name: Lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install project toolchain
        run: |
          python -m pip install uv
          uv sync --all-extras --all-groups
      - name: Lint and type-check
        id: lint
        run: uv run python scripts/lint-all.py
      - name: Application suite
        id: application-suite
        # After a red lint too, so one gate cycle names both failures.
        if: success() || steps.lint.outcome == 'failure'
        run: uv run python scripts/run-tests.py
      - name: Harness hook tests
        # The JUnit report is their failure log: without it a red vendored suite
        # uploads nothing the fix pass can read.
        if: success() || steps.lint.outcome == 'failure' || steps.application-suite.outcome == 'failure'
        run: uv run python -m pytest scripts/hooks/tests/ -q --junit-xml=logs/junit-hooks.xml
      - name: Upload failure logs
        # Each runner prints only "FAILED - details in <its log>", so without this the
        # fix pass's evidence names no failing test or lint finding.
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failure-logs
          path: |
            logs/lint-errors.log
            logs/test-failures.log
            logs/junit-hooks.xml
          if-no-files-found: ignore

  devkit-drift:
    name: Vendored harness drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check out released DevKit
        uses: actions/checkout@v7
        with:
          repository: alexandrec90/devkit
          ref: v0.11.72
          path: .devkit-src
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Drift check
        env:
          DEVKIT_DIR: ${{ github.workspace }}/.devkit-src
        run: python scripts/sync-devkit.py --check
