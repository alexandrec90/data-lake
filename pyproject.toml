[project]
name = "data-lake"
version = "0.1.0"
description = "Shared ingestion + cold-storage layer: provider connectors that upsert into a caller-owned Postgres, and a Parquet/R2 archive with a self-describing catalog."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "SQLAlchemy>=2.0",
    "pandas>=2.2",
    "httpx>=0.27",
    # Connector clients. Imported lazily inside the connectors that need them (so importing
    # the package never pulls a provider SDK), but a working install needs them present.
    "praw>=7.7",
    "pytrends>=4.9",
    "yfinance>=0.2.50",
]

[project.optional-dependencies]
# Parquet cold storage. Guarded-import pattern: archive/ imports without these, and raises a
# clear install hint when a command actually needs to read or write Parquet.
archive = [
    "pyarrow>=17",
    "boto3>=1.34",
]
# Read-only DuckDB research lens over the archived Parquet.
research = [
    "duckdb>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.4",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_lake"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# E501 (line-too-long) is off deliberately, and was never chosen in the first place:
# `"E"` above is a *family prefix* and line-too-long is one of its 19 members, so it
# arrived with the family, not because anyone decided lines should be capped.
#
# `.claude/rules/engineering.md` already settles it: lint is for correctness and
# security, and "anything a formatter can decide" is off. `line-length` above is
# untouched and still drives `ruff format`, so code is still wrapped -- silently, on
# every edit, instead of failing a commit. E501 only ever fires where the formatter
# *cannot* split (long string literals, URLs), which is exactly where the report
# cannot be acted on.
#
# The rest of `E` stays: E711/E712/E722/E902/E999 are real correctness checks. Adding a
# rule family here means checking its members for more cosmetic riders like this one.
ignore = ["E501"]

[tool.mypy]
# Matches ibkr_trader's floor: numpy's bundled stubs use 3.12+ syntax, so a 3.11 analysis
# target makes mypy choke parsing them. requires-python = ">=3.11" still holds at runtime.
python_version = "3.12"
mypy_path = "src"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

# Same ratchet rule as the consumer repo: raise it as coverage grows, never lower it to make a
# change pass. Set to 91 on 2026-07-30 against a measured 92% at extraction.
[tool.coverage.report]
fail_under = 91
show_missing = true
skip_covered = true

[tool.coverage.run]
branch = true
