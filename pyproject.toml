[project]
name = "data-lake"
version = "0.1.0"
description = "Shared ingestion + cold-storage layer: provider connectors that upsert into a caller-owned Postgres, and a Parquet/R2 archive with a self-describing catalog."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "SQLAlchemy>=2.0",
    "pandas>=2.2",
    "httpx>=0.27",
    # Connector clients. Imported lazily inside the connectors that need them (so importing
    # the package never pulls a provider SDK), but a working install needs them present.
    "praw>=8.0.3",
    "pytrends>=4.9",
    "yfinance>=1.7.0",
]

[project.optional-dependencies]
# Parquet cold storage. Guarded-import pattern: archive/ imports without these, and raises a
# clear install hint when a command actually needs to read or write Parquet.
archive = [
    "pyarrow>=25.0.1",
    "boto3>=1.43.82",
]
# Read-only DuckDB research lens over the archived Parquet.
research = [
    "duckdb>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.16.5",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_lake"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# Correctness and security only. `.claude/rules/engineering.md` is the policy: lint
# catches the problems a reviewer reads past, and "anything a formatter can decide" is
# off.
#
# Dropped families -- none of them can report a defect. Each enforces a preferred
# spelling of code that already behaves identically:
#
#   I    import ordering            UP   preferred modern syntax
#   SIM  readability rewrites       N    naming conventions
#   T20  stray print() calls
#
# They were also nearly free to violate already: `ruff check --fix` rewrites all of
# them silently in the lint-fix PostToolUse hook, in pre-commit, and in lint-all.py.
# What enforcing them bought was churn in every diff, not a bug caught.
select = ["E", "F", "B"]

# `E` is a *family prefix* carrying 19 rules, and only some are about correctness.
# That is exactly how E501 (line-too-long) came to be enforced: nobody selected it,
# they selected `"E"`, and it rode in with the family -- then got suppressed one
# directory at a time for years rather than questioned. Listed here are its cosmetic
# members: line length, statement layout, semicolons, ambiguous single-char names.
#
# E501 is also the one that actually blocked a commit, because it is the one with **no
# autofix** -- it fires precisely where the formatter cannot split a line (long string
# literals, URLs), so there was never an action to take.
#
# `line-length` above is untouched and still drives `ruff format`: code is still
# wrapped, silently, on every edit.
#
# Still on: E402, E711/E712/E713/E714 (comparison bugs), E721, E722 (bare except),
# E902, E999. Those catch real defects.
#
# E731 (lambda assignment) rejoined this list with the v0.7.0 pull, which is what the
# previous note here said would unblock it. It was held out because the vendored
# `scripts/hooks/tests/test_repo_contract.py` carried a `# noqa: E731`, and ignoring the
# rule would have made that directive dead -- in a file this repo may not edit, since
# the `devkit-drift` gate compares against the pinned devkit rev. Upstream dropped the
# directive, so the rule can go off here without stranding a suppression.
ignore = ["E101", "E401", "E501", "E701", "E702", "E703", "E731", "E741", "E742", "E743"]

[tool.mypy]
# Matches ibkr_trader's floor: numpy's bundled stubs use 3.12+ syntax, so a 3.11 analysis
# target makes mypy choke parsing them. requires-python = ">=3.11" still holds at runtime.
python_version = "3.12"
mypy_path = "src"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

# Same ratchet rule as the consumer repo: raise it as coverage grows, never lower it to make a
# change pass. Set to 91 on 2026-07-30 against a measured 92% at extraction.
[tool.coverage.report]
fail_under = 91
show_missing = true
skip_covered = true

[tool.coverage.run]
branch = true
